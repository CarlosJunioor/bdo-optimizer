[package]
name = "bdo-optimizer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop GUI: detect hardware, apply the optimal BDO CPU-affinity, and benchmark FPS locally"

[[bin]]
name = "bdo-optimizer"
path = "src/main.rs"

# Embeds assets/icon.ico into the .exe as its file icon (Windows builds only).
[build-dependencies]
winresource = "0.1"

[dependencies]
bdo-hw = { path = "../hw" }
bdo-launch = { path = "../launch" }
bdo-bench = { path = "../bench" }

# GUI stack — pinned together on egui 0.35. eframe's DEFAULT backend is wgpu
# (v29), which would collide with the wgpu v30 that `bdo-hw` pulls for adapter
# enumeration — two wgpu copies in the tree. We disable defaults and select the
# `glow` (OpenGL) backend instead, so eframe brings no wgpu at all and the only
# egui in the tree is v0.35. egui_plot 0.36 targets egui ^0.35.
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.35"
egui_plot = "0.36"
# Phosphor icon font for nav, section headers and status rows.
egui-phosphor = "0.13"

# Native file picker for the launcher path.
rfd = "0.17"

# Hash-pinning the bundled NVIDIA Profile Inspector (same as bench's PresentMon pin).
sha2 = "0.10.9"

# Locating Documents\Black Desert for the guide's config-file edits.
directories = "6.0.0"

# Parsing the GitHub Releases API response for the in-app updater (already in
# the tree via bdo-bench's session files).
serde_json = "1.0.151"

# Decoding the embedded window/taskbar icon (the crate is already in the tree).
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Windows-only: relaunch the app elevated (ShellExecuteW verb "runas") from the
# Benchmark tab's "Restart as administrator" button.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
